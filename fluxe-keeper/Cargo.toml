[package]
name = "fluxe-keeper"
version = "0.1.0"
edition = "2021"
description = "Unified keeper for FLUXE cross-chain pool rebalancing"

[dependencies]
# Async runtime
tokio = { version = "1.39", features = ["full"] }

# HTTP client for CCTP attestation API and RPC calls
reqwest = { version = "0.12", features = ["json"] }

# Ethereum (using alloy instead of ethers for better compatibility)
alloy = { version = "0.3", features = ["full", "node-bindings"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config
dotenvy = "0.15"

# Hex encoding
hex = "0.4"

# Crypto
sha2 = "0.10"

# Base58 for Solana addresses
bs58 = "0.5"

# Base64 decoding
base64 = "0.22"

[[bin]]
name = "fluxe-keeper"
path = "src/main.rs"
