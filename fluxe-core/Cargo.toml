[package]
name = "fluxe-core"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
ark-bn254 = { workspace = true }
ark-crypto-primitives = { workspace = true }
ark-ec = { workspace = true }
ark-ed-on-bn254 = { workspace = true }
ark-ff = { workspace = true }
ark-groth16 = { workspace = true }
ark-r1cs-std = { workspace = true }
ark-relations = { workspace = true }
ark-serialize = { workspace = true }
ark-snark = { workspace = true }
ark-std = { workspace = true }
blake2 = { workspace = true }
chacha20poly1305 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
toml = "0.8"
num_cpus = "1.16"
rocksdb = { version = "0.22", optional = true }
bincode = "1.3"

# Ethereum bridge dependencies (Phase 3.1 - Ethereum deposit monitoring)
ethers = { version = "2.0", features = ["rustls"], optional = true }
tokio = { version = "1.35", features = ["sync", "time", "rt", "macros", "rt-multi-thread"], optional = true }

# Solana bridge dependencies (Phase 3.1 - Solana deposit monitoring)
# Note: Using 2.x series for better compatibility with ark-ff zeroize requirements
solana-client = { version = "2.0", optional = true }
solana-sdk = { version = "2.0", optional = true }
solana-transaction-status = { version = "2.0", optional = true }
base64 = "0.22"
bs58 = "0.5"

[features]
default = ["parallel"]
parallel = ["ark-ff/parallel", "ark-ec/parallel"]
persistence = ["rocksdb"]
ethereum = ["ethers", "tokio"]
solana = ["solana-client", "solana-sdk", "solana-transaction-status"]
bridge = ["ethereum"]
integration-tests = []

[dev-dependencies]
tempfile = "3"