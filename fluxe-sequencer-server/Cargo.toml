[package]
name = "fluxe-sequencer-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Production JSON-RPC sequencer server for FLUXE rollup"

[features]
default = ["parallel"]
parallel = ["fluxe-core/parallel"]
persistence = ["fluxe-core/persistence"]

[dependencies]
# Workspace dependencies
fluxe-core = { path = "../fluxe-core" }
ark-bn254 = { workspace = true }
ark-groth16 = { workspace = true }
ark-ff = { workspace = true }
ark-serialize = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }

# JSON-RPC server
jsonrpsee = { version = "0.24", features = ["server", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
anyhow = "1.0"

# HTTP/Web
hyper = { version = "1.4", features = ["full"] }

# Async runtime
futures = "0.3"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
config = "0.14"
dotenvy = "0.15"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Metrics
prometheus = "0.13"

# Utilities
parking_lot = "0.12"
dashmap = "6.0"
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
tokio-test = "0.4"
jsonrpsee = { version = "0.24", features = ["client"] }
tempfile = "3"
criterion = "0.5"

[[bin]]
name = "fluxe-sequencer"
path = "src/main.rs"

# [[bench]]
# name = "rpc_throughput"
# harness = false
