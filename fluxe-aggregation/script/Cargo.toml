[package]
name = "fluxe-aggregation-script"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host-side script for FLUXE proof aggregation"

[dependencies]
# Shared types
fluxe-aggregation-lib = { workspace = true }

# SP1 SDK for proof generation
sp1-sdk = { workspace = true }

# Arkworks for proof conversion
ark-bn254 = "0.5"
ark-ff = "0.5"
ark-ec = "0.5"
ark-groth16 = "0.5"
ark-serialize = "0.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Hex encoding
hex = "0.4"

# Async runtime
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
rand = "0.8"
rand_chacha = "0.3"
ark-relations = "0.5"

[build-dependencies]
sp1-build = { workspace = true }

[[bin]]
name = "aggregate"
path = "src/main.rs"

[[bin]]
name = "extract_vk"
path = "src/bin/extract_vk.rs"

[[bin]]
name = "genesis"
path = "src/bin/genesis.rs"
