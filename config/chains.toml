# FLUXE Multi-Chain Configuration - Mainnet
# This file configures the supported blockchain networks for FLUXE L2

# Default chain for operations that don't specify a chain
default_chain = 1

# Ethereum Mainnet Configuration
[chains.ethereum]
chain_id = 1
chain_type = "EVM"
name = "Ethereum Mainnet"
rpc_endpoint = "https://eth-mainnet.alchemyapi.io/v2/YOUR_ALCHEMY_KEY"
ws_endpoint = "wss://eth-mainnet.alchemyapi.io/v2/YOUR_ALCHEMY_KEY"
bridge_address = "0x0000000000000000000000000000000000000000"  # TODO: Deploy bridge contract
verifier_address = "0x0000000000000000000000000000000000000000"  # TODO: Deploy verifier contract
block_time_ms = 12000
finality_blocks = 32
max_batch_size = 100
base_fee = 1000000  # 1 USDC (6 decimals)
enabled = true

# USDC on Ethereum
[[chains.ethereum.assets]]
asset_type = 1
name = "USDC"
token_address = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
decimals = 6
min_deposit = 1000000  # 1 USDC
max_deposit = 1000000000000  # 1,000,000 USDC
enabled = true

# USDT on Ethereum
[[chains.ethereum.assets]]
asset_type = 2
name = "USDT"
token_address = "0xdAC17F958D2ee523a2206206994597C13D831ec7"
decimals = 6
min_deposit = 1000000  # 1 USDT
max_deposit = 1000000000000  # 1,000,000 USDT
